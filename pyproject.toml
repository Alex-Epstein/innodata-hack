[project]
name = "visual-task-factory"
version = "0.1.0"
description = "Innodata hackathon, Track 2: a pipeline that builds, checks and scores visual reasoning tasks"
requires-python = ">=3.12,<3.13"
dependencies = [
    "matplotlib>=3.11.2",
    "numpy>=2.5.4",
    "pillow>=13.0.0",
]

# Not an installable package: the code runs from the repository root (python -m factory, python -m eval.run).
[tool.uv]
package = false
