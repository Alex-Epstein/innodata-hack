<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>The Map vs the Mountain</title>

<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="gl"></div>
<div id="fade"></div>
<div id="labels"></div>

<header id="collar-top">
  <div class="brand">
    <div class="cap t1">The Map <i>vs</i> the Mountain</div>
    <div class="cap t2" id="quad"></div>
  </div>
  <div class="tally mono" id="tally"></div>
</header>

<footer id="collar-bottom">
  <div class="mono coords" id="coords"></div>
  <nav id="missions"></nav>
  <div class="cap keys"><b>S</b> show <b>N</b> next <b>R</b> restart <b>F</b> fullscreen</div>

<div id="lockup"><span class="a cap">The Map</span><span class="v serif">vs</span><span class="b cap">The Mountain</span></div>
<div id="caption" class="serif"></div>

<div id="hud">
  <div class="count">
    <div class="cap" id="hud-label"></div>
    <div class="mono big" id="hud-value"></div>
    <div class="mono sub" id="hud-sub"></div>
  </div>
  <div id="ruler"></div>
</div>
<div id="profile"></div>

<aside id="panel"></aside>
<section id="chapter"></section>

<div id="loader">
  <div class="cap t1">The Map <i>vs</i> the Mountain</div>
  <div class="mono big" id="load-elev">0 m</div>
  <div class="bar"><i id="load-bar"></i></div>
  <div class="cap t2" id="load-note">Reading elevation · USGS 3DEP</div>
</div>

<script src="vendor/three-0.160.0.bundle.js"></script>
