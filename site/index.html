<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Beat the AI · Map Missions</title>
<meta name="description" content="Can you read a topographic map better than Claude Haiku 5.5 and GPT-6 Luna?">
<style>
  :root {
    --bg: #f6f4ee; --card: #ffffff; --ink: #1f2328; --muted: #5d6470; --line: #d9d6cc;
    --accent: #9a5a22; --accent-ink: #ffffff; --good: #1e7a3c; --good-bg: #e3f3e8; --bad: #b3261e; --bad-bg: #fbe7e5;
    --chip: #efeadf; --sel: #2b5fa8; --sel-bg: #e4ecf8;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #15171a; --card: #1f2226; --ink: #eceae4; --muted: #a3a8b0; --line: #34383e;
      --accent: #d08a4a; --accent-ink: #15171a; --good: #6fcf8f; --good-bg: #183323; --bad: #f2867c; --bad-bg: #3a1c1a;
      --chip: #2a2d32; --sel: #8db4ec; --sel-bg: #1d2a3d;
    }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--ink); font: 16px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
  main { max-width: 760px; margin: 0 auto; padding: 12px 16px 40px; }
  header { display: flex; align-items: center; justify-content: space-between; gap: 8px; padding: 6px 0 10px; }
  h1 { font-size: 20px; margin: 0; letter-spacing: .2px; }
  h1 span { color: var(--accent); }
  .score { display: flex; gap: 6px; font-size: 13px; }
  .score div { background: var(--card); border: 1px solid var(--line); border-radius: 8px; padding: 3px 8px; text-align: center; min-width: 54px; }
  .score b { display: block; font-size: 16px; }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 14px; margin-top: 10px; }
  .meta { display: flex; justify-content: space-between; align-items: center; font-size: 13px; color: var(--muted); }
  h2 { font-size: 18px; margin: 4px 0 8px; }
  .timer { height: 8px; background: var(--chip); border-radius: 4px; overflow: hidden; margin: 6px 0 10px; }
  .timer i { display: block; height: 100%; width: 100%; background: var(--accent); transition: width .25s linear; }
  .timer.low i { background: var(--bad); }
  .map { display: block; width: 100%; border-radius: 8px; border: 1px solid var(--line); background: #fff; }
  .hint { font-size: 12px; color: var(--muted); margin: 4px 0 0; }
  .key { font-size: 13px; color: var(--muted); margin: 10px 0 4px; }
  .q { margin: 0 0 12px; }
  .opts { display: flex; flex-wrap: wrap; gap: 8px; }
  button { font: inherit; cursor: pointer; border-radius: 10px; border: 1px solid var(--line); background: var(--chip); color: var(--ink); padding: 12px 16px; min-width: 64px; min-height: 48px; }
  button.sel { background: var(--sel-bg); border-color: var(--sel); color: var(--sel); font-weight: 600; }
  button.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); font-weight: 600; }
  button:disabled { opacity: .5; cursor: default; }
  .row { display: flex; gap: 8px; margin-top: 10px; align-items: center; }
  input[type=text] { font: inherit; font-size: 20px; padding: 10px 12px; border-radius: 10px; border: 1px solid var(--line); background: var(--card); color: var(--ink); width: 9em; }
  .err { color: var(--bad); font-size: 13px; min-height: 18px; margin-top: 4px; }
  .verdicts { display: grid; gap: 8px; }
  .v { display: flex; justify-content: space-between; align-items: center; gap: 10px; border-radius: 10px; padding: 10px 12px; border: 1px solid var(--line); }
  .v.good { background: var(--good-bg); border-color: var(--good); }
  .v.bad { background: var(--bad-bg); border-color: var(--bad); }
  .v .who { font-weight: 600; }
  .v .ans { font-variant-numeric: tabular-nums; text-align: right; }
  .mark { font-weight: 700; margin-left: 6px; }
  .good .mark { color: var(--good); } .bad .mark { color: var(--bad); }
  .truth { font-size: 18px; margin: 4px 0 10px; }
  .truth b { color: var(--accent); }
  details { margin-top: 10px; font-size: 14px; }
  summary { cursor: pointer; color: var(--muted); }
  table { border-collapse: collapse; margin-top: 6px; font-size: 13px; width: 100%; }
  td, th { border-bottom: 1px solid var(--line); padding: 4px 6px; text-align: left; vertical-align: top; }
  .intro p { margin: 6px 0; }
  .small { font-size: 12px; color: var(--muted); }
  a { color: var(--sel); }
</style>
</head>
<body>
<main>
  <header>
    <h1>Beat the <span>AI</span></h1>
    <div class="score" aria-live="polite">
      <div>You<b id="s-you">0</b></div><div>Haiku<b id="s-haiku">0</b></div><div>Luna<b id="s-luna">0</b></div>
    </div>
  </header>
  <div id="app"></div>
  <p class="small" id="foot"></p>
</main>
<script>
"use strict";
const TIME = 60;
const app = document.getElementById("app");
let DATA = null, order = [], idx = 0, timer = null, left = TIME, picked = new Set(), locked = false;

// ---- per-viewer progress (localStorage, safe if blocked)
const store = {
  get() { try { return JSON.parse(localStorage.getItem("bta-v1")) || {}; } catch (e) { return {}; } },
  set(v) { try { localStorage.setItem("bta-v1", JSON.stringify(v)); } catch (e) {} },
};
let played = store.get();

function el(tag, attrs, ...kids) {
  const n = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs || {})) {
    if (k === "class") n.className = v; else if (k.startsWith("on")) n.addEventListener(k.slice(2), v); else n.setAttribute(k, v);
  }
  for (const c of kids.flat()) if (c != null) n.append(c.nodeType ? c : document.createTextNode(String(c)));
  return n;
}

// ---- scoring: same rules as eval/scoring.py for the answer types the page uses
const norm = s => String(s).toLowerCase().replace(/&/g, " and ").replace(/[^a-z0-9$.\-: ]+/g, " ").replace(/^\s*the\s+/, "").replace(/\s+/g, " ").trim().replace(/^\.+|\.+$/g, "");
function toNumber(s) {
  s = String(s).replace(/[−–]/g, "-").replace(/,/g, "").trim();
  const m = s.replace(/\s/g, "").match(/[-+]?(?:\d+\.?\d*|\.\d+)/);
  return m ? parseFloat(m[0]) : null;
}
function isCorrect(t, given) {
  if (given == null || String(given).trim() === "") return false;
  if (t.answer_type === "integer") { const x = toNumber(given); return x !== null && x === Number(t.answer); }
  if (t.answer_type === "number") {
    const x = toNumber(given); if (x === null) return false;
    const ref = Number(t.answer);
    const lim = t.tolerance_abs != null ? Number(t.tolerance_abs) : t.tolerance_rel != null ? Number(t.tolerance_rel) * Math.abs(ref) : 0;
    return Math.abs(x - ref) <= lim + 1e-9 * Math.max(1, Math.abs(ref));
  }
  if (t.answer_type === "sequence") {
    const got = String(given).split(/\s*(?:,|;|->|→|\|)\s*/).map(norm).filter(Boolean);
    const want = (Array.isArray(t.answer) ? t.answer : String(t.answer).split(",")).map(norm).filter(Boolean);
    if (t.ordered === false) { got.sort(); want.sort(); }
    return got.length === want.length && got.every((g, i) => g === want[i]);
  }
  return norm(given) === norm(t.answer);
}
const showAns = a => Array.isArray(a) ? (a.length ? a.join(", ") : "(none)") : String(a);

function updateScore() {
  let you = 0, h = 0, l = 0;
  for (const t of DATA.tasks) {
    const p = played[t.id]; if (!p) continue;
    you += p.you ? 1 : 0;
    h += t.models.Haiku && t.models.Haiku.correct ? 1 : 0;
    l += t.models.Luna && t.models.Luna.correct ? 1 : 0;
  }
  document.getElementById("s-you").textContent = you;
  document.getElementById("s-haiku").textContent = h;
  document.getElementById("s-luna").textContent = l;
}

function splitQuestion(q) {
  const m = q.match(/^(This is a topographic map\..*?elevations are in meters\.)\s*(.*)$/s);
  return m ? [m[1], m[2]] : ["", q];
}

function intro() {
  stop();
  const n = Object.keys(played).length;
  app.replaceChildren(el("div", { class: "card intro" },
    el("h2", {}, "Can you read a map better than an AI?"),
    el("p", {}, "Each round shows a real-looking topographic map and a rescue mission. You get ", el("b", {}, "60 seconds"), "."),
    el("p", {}, "Then see what ", el("b", {}, "Claude Haiku 5.5"), " and ", el("b", {}, "GPT-6 Luna"), " answered on the same task, and the true answer computed from the map's data."),
    el("p", { class: "small" }, "Tip: pinch to zoom the map, or tap it to open it full size."),
    el("div", { class: "row" },
      el("button", { class: "primary", onclick: () => { idx = firstUnplayed(); show(); } }, n ? "Continue" : "Start"),
      n ? el("button", { onclick: () => { played = {}; store.set(played); updateScore(); idx = 0; show(); } }, "Start over") : null)));
}

function firstUnplayed() {
  const i = order.findIndex(id => !played[id]);
  return i < 0 ? 0 : i;
}

function show() {
  stop();
  const t = DATA.tasks.find(x => x.id === order[idx]);
  picked = new Set(); locked = false; left = TIME;
  const [key, q] = splitQuestion(t.question);
  const bar = el("i", {});
  const timerBox = el("div", { class: "timer", role: "progressbar", "aria-label": "time left" }, bar);
  const timeText = el("span", {}, `${TIME}s`);
  const err = el("div", { class: "err", "aria-live": "polite" });
  const img = el("img", { class: "map", src: t.image, alt: `Map for task ${t.id}` });
  const imgLink = el("a", { href: t.image, target: "_blank", rel: "noopener" }, img);

  let inputArea, getAnswer;
  if (t.input === "choice" || t.input === "multi") {
    const btns = t.options.map(o => el("button", { onclick: e => {
      if (locked) return;
      if (t.input === "choice") { picked = new Set([o]); submit(); return; }
      picked.has(o) ? picked.delete(o) : picked.add(o);
      e.currentTarget.classList.toggle("sel", picked.has(o)); err.textContent = "";
    } }, o));
    inputArea = el("div", {}, el("div", { class: "opts" }, btns),
      t.input === "multi" ? el("div", { class: "row" },
        el("button", { class: "primary", onclick: () => submit() }, "Lock in"),
        el("span", { class: "small" }, "Tap every one that applies (or none).")) : null);
    getAnswer = () => [...picked].sort().join(", ");
  } else {
    const box = el("input", { type: "text", inputmode: t.input === "number" ? "decimal" : "text", autocomplete: "off", placeholder: t.input === "number" ? "number" : "answer",
      onkeydown: e => { if (e.key === "Enter") submit(); }, oninput: () => { err.textContent = ""; } });
    inputArea = el("div", { class: "row" }, box, el("button", { class: "primary", onclick: () => submit() }, "Lock in"));
    getAnswer = () => box.value.trim();
  }

  function submit(timedOut) {
    if (locked) return;
    const a = getAnswer();
    if (!timedOut && t.input === "number" && toNumber(a) === null) { err.textContent = "Enter a number first."; return; }
    if (!timedOut && t.input === "text" && !a) { err.textContent = "Enter an answer first."; return; }
    locked = true; stop();
    const ok = isCorrect(t, a);
    played[t.id] = { you: ok, answer: a, timedOut: !!timedOut };
    store.set(played); updateScore();
    reveal(t, a, ok, !!timedOut);
  }

  app.replaceChildren(el("div", { class: "card" },
    el("div", { class: "meta" }, el("span", {}, `Round ${idx + 1} of ${order.length}`), timeText),
    timerBox,
    el("h2", {}, t.title),
    imgLink, el("p", { class: "hint" }, "Pinch to zoom, or tap the map to open it full size."),
    key ? el("p", { class: "key" }, key) : null,
    el("p", { class: "q" }, q),
    inputArea, err));

  timer = setInterval(() => {
    left -= 1;
    bar.style.width = `${Math.max(0, left / TIME * 100)}%`;
    timeText.textContent = `${Math.max(0, left)}s`;
    timerBox.classList.toggle("low", left <= 10);
    if (left <= 0) submit(true);
  }, 1000);
}

function stepsView(steps) {
  if (steps == null) return null;
  const cell = v => typeof v === "number" ? (Number.isInteger(v) ? v : v.toFixed(1)) : typeof v === "object" ? JSON.stringify(v) : String(v);
  const tableOf = rows => {
    const cols = [...new Set(rows.flatMap(r => Object.keys(r)))];
    return el("table", {}, el("tr", {}, cols.map(c => el("th", {}, c.replace(/_/g, " ")))),
      rows.map(r => el("tr", {}, cols.map(c => el("td", {}, r[c] === undefined ? "" : cell(r[c]))))));
  };
  if (Array.isArray(steps)) return steps.length && typeof steps[0] === "object" ? tableOf(steps) : el("p", {}, steps.join(" → "));
  const flat = [], nested = [];
  for (const [k, v] of Object.entries(steps)) (Array.isArray(v) && v.length && typeof v[0] === "object" ? nested : flat).push([k, v]);
  return el("div", {},
    flat.length ? el("table", {}, flat.map(([k, v]) => el("tr", {}, el("th", {}, k.replace(/_/g, " ")), el("td", {}, cell(v))))) : null,
    nested.map(([k, v]) => el("div", {}, el("p", { class: "small" }, k.replace(/_/g, " ")), tableOf(v))));
}

function reveal(t, a, ok, timedOut) {
  const row = (who, ans, good) => el("div", { class: `v ${good ? "good" : "bad"}` },
    el("span", { class: "who" }, who),
    el("span", { class: "ans" }, ans === "" ? "(no answer)" : ans, el("span", { class: "mark" }, good ? "✓" : "✗")));
  const models = Object.entries(t.models);
  const missed = models.filter(([, m]) => !m.correct).length;
  const line = missed === models.length ? "Both AIs got this one wrong." : missed ? "One AI got this one wrong." : "Both AIs got this one right.";
  app.replaceChildren(el("div", { class: "card" },
    el("div", { class: "meta" }, el("span", {}, `Round ${idx + 1} of ${order.length}`), el("span", {}, timedOut ? "Time's up" : "")),
    el("h2", {}, t.title),
    el("p", { class: "truth" }, "True answer: ", el("b", {}, showAns(t.answer)),
      t.tolerance_abs != null ? el("span", { class: "small" }, ` (within ±${t.tolerance_abs} accepted)`) : null),
    el("div", { class: "verdicts" },
      row("You", timedOut && !a ? "" : a, ok),
      models.map(([name, m]) => row(name, m.answer, m.correct))),
    el("p", { class: "small" }, line),
    el("a", { href: t.overlay || t.image, target: "_blank", rel: "noopener" },
      el("img", { class: "map", src: t.overlay || t.image, alt: t.overlay ? "The map with the true answer drawn on it" : "The map" })),
    t.overlay ? el("p", { class: "hint" }, "The true answer drawn on the map.") : null,
    t.steps ? el("details", {}, el("summary", {}, "Show the working (computed from the map's data)"), stepsView(t.steps)) : null,
    el("div", { class: "row" },
      el("button", { class: "primary", onclick: () => { idx = (idx + 1) % order.length; show(); } }, idx + 1 < order.length ? "Next map" : "Back to round 1"),
      el("button", { onclick: intro }, "Menu"))));
  window.scrollTo({ top: 0, behavior: "smooth" });
}

function stop() { if (timer) clearInterval(timer); timer = null; }

fetch("tasks.json", { cache: "no-store" }).then(r => r.json()).then(d => {
  DATA = d; order = d.tasks.map(t => t.id);
  document.getElementById("foot").textContent =
    `${d.n_tasks} tasks. Model answers are the real, scored replies from our evaluation (temperature 0, reasoning effort high). ` +
    `Every map and answer is generated from structured data by code.`;
  updateScore(); intro();
}).catch(() => {
  app.replaceChildren(el("div", { class: "card" }, el("h2", {}, "Couldn't load the tasks"), el("p", {}, "Open this page from its web address (not as a local file), then reload.")));
});
</script>
</body>
</html>
